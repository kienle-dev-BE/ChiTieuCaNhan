<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0512" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chi tiêu" />
    <title>Quản lý chi tiêu cá nhân</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./Logo.png" />
    <link rel="apple-touch-icon" href="./Logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./Logo.png" />
    <link rel="stylesheet" href="./app.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__brand">
        <img class="app-header__logo" src="./Logo.png" alt="" width="42" height="42" />
        <div class="app-header__text">
          <div class="app-header__title">Chi tiêu cá nhân</div>
          <div class="app-header__subtitle">Quản lý thu chi</div>
        </div>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Điều hướng">
        <div class="brand">
          <div class="brand__logo" aria-hidden="true">💸</div>
          <div class="brand__text">
            <div class="brand__name">Chi tiêu</div>
            <div class="brand__tag">Quản lý cá nhân</div>
          </div>
        </div>

        <nav class="nav">
          <button class="nav__item is-active" data-view="dashboard" type="button">
            Dashboard
          </button>
          <button class="nav__item" data-view="transactions" type="button">
            Giao dịch
          </button>
          <button class="nav__item" data-view="categories" type="button">
            Danh mục
          </button>
          <button class="nav__item" data-view="budgets" type="button">
            Ngân sách
          </button>
          <button class="nav__item" data-view="settings" type="button">
            Cài đặt
          </button>
        </nav>

        <div class="sidebar__footer">
          <button class="btn btn--secondary w-full" id="btnQuickAdd" type="button">
            + Thêm giao dịch
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar__left">
            <div class="topbar__balance-label">Tổng số dư</div>
            <div class="topbar__balance" id="topbarTotalBalance">—</div>
          </div>

          <div class="topbar__right">
            <div class="period-picker" id="periodPickerWrap">
              <div class="period-picker__group">
                <button class="period-picker__display" id="monthPickerToggle" type="button" aria-haspopup="true" aria-expanded="false">
                  <span class="period-picker__label">Tháng</span>
                  <span class="period-picker__value" id="monthPickerDisplay">—</span>
                </button>
                <div class="period-picker__panel" id="monthPickerPanel" hidden>
                  <div class="period-picker__grid period-picker__grid--months" id="monthPickerGrid"></div>
                </div>
              </div>

              <div class="period-picker__group">
                <button class="period-picker__display period-picker__display--year" id="yearPickerToggle" type="button" aria-haspopup="true" aria-expanded="false">
                  <span class="period-picker__label">Năm</span>
                  <span class="period-picker__value" id="yearPickerDisplay">—</span>
                </button>
                <div class="period-picker__panel period-picker__panel--year" id="yearPickerPanel" hidden>
                  <div class="period-picker__header">
                    <button class="period-picker__nav" id="yearPickerPrev" type="button" aria-label="Nhóm năm trước">‹</button>
                    <span class="period-picker__range" id="yearPickerRange">—</span>
                    <button class="period-picker__nav" id="yearPickerNext" type="button" aria-label="Nhóm năm sau">›</button>
                  </div>
                  <div class="period-picker__grid period-picker__grid--years" id="yearPickerGrid"></div>
                </div>
              </div>
            </div>
          </div>
        </header>

        <section class="content" id="app" aria-live="polite">
          <!-- Render view here -->
        </section>
      </main>
    </div>

    <button class="fab" id="btnQuickAddMobile" type="button" aria-label="Thêm giao dịch">+</button>
    <nav class="bottom-nav" aria-label="Điều hướng điện thoại">
      <button class="nav__item bottom-nav__item is-active" data-view="dashboard" type="button">
        <span class="bottom-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
        </span>
        <span class="bottom-nav__label">Tổng quan</span>
      </button>
      <button class="nav__item bottom-nav__item" data-view="transactions" type="button">
        <span class="bottom-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h12" />
            <path d="M14 4l3 3-3 3" />
            <path d="M20 17H8" />
            <path d="M10 20l-3-3 3-3" />
          </svg>
        </span>
        <span class="bottom-nav__label">Giao dịch</span>
      </button>
      <button class="nav__item bottom-nav__item" data-view="categories" type="button">
        <span class="bottom-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h7l2 2h7v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z" />
            <path d="M4 7V6a2 2 0 0 1 2-2h4l2 2" />
          </svg>
        </span>
        <span class="bottom-nav__label">Danh mục</span>
      </button>
      <button class="nav__item bottom-nav__item" data-view="budgets" type="button">
        <span class="bottom-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8" />
            <circle cx="12" cy="12" r="3" />
            <path d="M12 4v2.5" />
            <path d="M12 17.5V20" />
            <path d="M4 12h2.5" />
            <path d="M17.5 12H20" />
          </svg>
        </span>
        <span class="bottom-nav__label">Ngân sách</span>
      </button>
      <button class="nav__item bottom-nav__item" data-view="settings" type="button">
        <span class="bottom-nav__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21V14" />
            <path d="M4 10V3" />
            <path d="M12 21V12" />
            <path d="M12 8V3" />
            <path d="M20 21V16" />
            <path d="M20 12V3" />
            <path d="M2 14h4" />
            <path d="M10 8h4" />
            <path d="M18 16h4" />
          </svg>
        </span>
        <span class="bottom-nav__label">Cài đặt</span>
      </button>
    </nav>

    <div class="modal-backdrop" id="modalBackdrop" hidden></div>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
      <div class="modal__content">
        <div class="modal__header">
          <div class="modal__title" id="modalTitle">Tiêu đề</div>
          <button class="icon-btn" id="modalClose" type="button" aria-label="Đóng">✕</button>
        </div>
        <div class="modal__body" id="modalBody"></div>
        <div class="modal__footer" id="modalFooter"></div>
      </div>
    </div>

    <input id="importFile" type="file" accept=".json,.csv" hidden />

    <script src="./app.js"></script>
  </body>
</html>
